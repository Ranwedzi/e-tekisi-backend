version: '3.8'
services:
  db:
    image: postgres:15
    container_name: etekisi_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: etekisi@123
      POSTGRES_DB: etekisi_db
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always  