# Local stack: Postgres + backend + frontend, and Mailpit for account emails.
#
#   cp .env.example .env
#   docker compose up -d --build        # everything
#   docker compose up -d db             # just the database (run the apps on the host)
#
# Then open http://localhost:3000. The backend runs the dev profile, so the
# sandbox wallet top-up works and no real money moves. For production use
# docker-compose.prod.yml instead.
#
# The frontend is built from its own repo, expected next to this one
# (../../e-tekisi-frontend-main/e-tekisi-frontend-main); set FRONTEND_DIR in
# .env if yours lives elsewhere.
services:
  db:
    image: postgres:15
    container_name: etekisi_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-etekisi_db}
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-etekisi_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./e-tekisi
      dockerfile: Dockerfile
    container_name: etekisi_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-etekisi_db}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # Account emails go to Mailpit: read them at http://localhost:8025.
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      PUBLIC_URL: http://localhost:3000
      # SMS codes are written to the backend log (docker compose logs backend).
      SMS_PROVIDER: log
      # The e2e suite signs up many accounts from one IP.
      LOGIN_IP_REQUESTS_PER_MINUTE: "1000"
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Catches every email the backend sends; web inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: etekisi_mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped

  frontend:
    build:
      context: ${FRONTEND_DIR:-../../e-tekisi-frontend-main/e-tekisi-frontend-main}
      args:
        # Called from the user's browser, so it's the host port, not "backend".
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: etekisi_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
