# Local development database. Credentials come from .env next to this file
# (copy .env.example to .env). The backend's dev defaults in
# application.properties match .env.example, so no extra setup is needed.
services:
  db:
    image: postgres:15
    container_name: etekisi_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-etekisi_db}
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
