spring.application.name=e-tekisi

# Active profile pivot. In production, set SPRING_PROFILES_ACTIVE=prod which
# layers application-prod.properties over this file (and all of its env-var
# placeholders become required, with no fallback default).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------------------------------------------------------------------------
# Database connection
# ---------------------------------------------------------------------------
# All sensitive values are env-var-sourced. The defaults shown after the colon
# are SAFE LOCAL DEV defaults, never production. CI and prod must export
# DB_URL, DB_USERNAME, DB_PASSWORD; the prod profile drops the defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/etekisi_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:change-me-local-dev}

# Flyway owns every schema (V1-V6 agent_schema, V7-V8 commuter/driver tables).
# Hibernate only validates that the entities match; it never changes the
# schema. Set JPA_DDL_AUTO=update only for throwaway experiments.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway — schema migrations. agent_schema is listed first because it holds
# the flyway_schema_history table.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=agent_schema,commuter_schema,driver_schema
spring.flyway.create-schemas=true
# Allow Flyway to baseline an existing dev database whose tables were created
# by the old ddl-auto=update. The prod profile turns this off.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true


# ---------------------------------------------------------------------------
# HTTP server
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
# Cap request body size to defend against trivial DoS and slow-body attacks.
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.max-file-size=2MB
# Hard cap on HTTP form post bytes (Tomcat-specific).
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=2MB

# ---------------------------------------------------------------------------
# Security — JWT
# ---------------------------------------------------------------------------
# Every endpoint that isn't explicitly public requires a valid JWT (there is
# no longer a permit-all mode).
# HS256 signing key. MUST be at least 32 bytes (256 bits). The dev default
# below is a stable, well-known throwaway so local devs aren't blocked; prod
# rejects this at startup via PropertyValidator.
tekisi.security.jwt.secret=${JWT_SIGNING_SECRET:dev-only-do-not-use-in-prod-min-32-bytes-xxx}
tekisi.security.jwt.issuer=${JWT_ISSUER:tekisi-dev}
tekisi.security.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:120}

# Field encryption for sensitive columns (payout bank details). Base64 of
# exactly 32 random bytes: openssl rand -base64 32. The dev default below is
# a throwaway; prod requires DATA_ENCRYPTION_KEY. Losing the key makes those
# columns unreadable, so back it up with the database credentials.
tekisi.security.data-key=${DATA_ENCRYPTION_KEY:dXhqNIuh8EB6vgZb8czc5EEbrMIX1Ow77ot2ubDE9Wg=}

# CORS — comma-separated list. Locked down by default; prod must enumerate
# real origins.
tekisi.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

# Brute-force protection on sign-in, sign-up, verification and password reset
# (in memory; see LoginThrottle). The per-account lockout is what stops
# password guessing; the per-IP limit only slows floods, and is kept loose
# because mobile networks put many customers behind one shared IP (CGNAT).
tekisi.security.login.max-failures=5
tekisi.security.login.lockout-minutes=15
tekisi.security.login.ip-requests-per-minute=${LOGIN_IP_REQUESTS_PER_MINUTE:60}

# First operator/admin account, created at startup if it doesn't exist.
# Leave ADMIN_BOOTSTRAP_EMAIL empty to skip. Password: 12+ characters.
tekisi.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
tekisi.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
tekisi.admin.bootstrap-name=${ADMIN_BOOTSTRAP_NAME:Operator}
tekisi.admin.bootstrap-role=${ADMIN_BOOTSTRAP_ROLE:OPERATOR}

# ---------------------------------------------------------------------------
# Money
# ---------------------------------------------------------------------------
# Highest fare (Rand) a driver may set when accepting a booking.
tekisi.booking.max-fare=${BOOKING_MAX_FARE:1000.00}
# How long a driver's fare offer waits for the commuter before the request reopens.
tekisi.booking.offer-ttl-seconds=${BOOKING_OFFER_TTL_SECONDS:120}
# Sandbox top-ups: no real money moves. Dev only — the prod profile turns this
# off, and top-up is refused until a real PaymentProvider is wired in.
tekisi.payments.sandbox-enabled=${PAYMENTS_SANDBOX_ENABLED:true}
tekisi.payments.topup-min=10.00
tekisi.payments.topup-max=2000.00
tekisi.payouts.min-amount=20.00
tekisi.payouts.max-amount=5000.00

# ---------------------------------------------------------------------------
# Tekisi AI-agent layer
# ---------------------------------------------------------------------------
# Dispatch
tekisi.agent.dispatch.max-radius-meters=5000
tekisi.agent.dispatch.min-actionable-score=0.45
tekisi.agent.dispatch.min-actionable-confidence=0.55
# ETA (heuristic — minibus avg speed incl. dwell)
tekisi.agent.eta.avg-speed-kmh=28.0
tekisi.agent.eta.max-km=80.0
# Safety thresholds — conservative by design
tekisi.agent.safety.deviation-threshold-meters=750
tekisi.agent.safety.stationary-seconds=180
tekisi.agent.safety.min-pings-required=4
# Where CRITICAL safety alerts are paged (empty = log only). Format "generic"
# (JSON with a "text" field; the secret, if set, goes in the Authorization
# header) or "pagerduty" (Events v2; the secret is the routing key).
tekisi.agent.safety.alert-webhook=${SAFETY_ALERT_WEBHOOK:}
tekisi.agent.safety.alert-webhook-format=${SAFETY_ALERT_WEBHOOK_FORMAT:generic}
tekisi.agent.safety.alert-webhook-secret=${SAFETY_ALERT_WEBHOOK_SECRET:}
# Link put in the page so on-call can acknowledge, e.g. https://tekisi.example.co.za/ops
tekisi.agent.safety.ops-console-url=${OPS_CONSOLE_URL:}
# Hotspot
tekisi.agent.hotspot.recommendation-ttl-seconds=300
tekisi.agent.hotspot.min-pending-for-hotspot=2
# Trip-Intent — LLM disabled by default; deterministic resolver only
tekisi.agent.intent.llm-enabled=false
tekisi.agent.intent.min-match-score=0.65

# Driver-location event throttling — applied to safety re-evaluation only.
# Trip GPS persistence is never throttled (data is never silently dropped).
tekisi.agent.throttle.location-min-interval-seconds=5
tekisi.agent.throttle.location-min-movement-meters=25.0

# External routing provider for ETA. Disabled by default — heuristic provider
# is the always-on fallback. When enabled, an HTTP routing API is consulted
# first; failures degrade transparently to the heuristic.
tekisi.agent.eta.routing.enabled=${ROUTING_API_ENABLED:false}
tekisi.agent.eta.routing.base-url=${ROUTING_API_BASE_URL:}
tekisi.agent.eta.routing.timeout-ms=1500
tekisi.agent.eta.routing.api-key=${ROUTING_API_KEY:}

# OpenStreetMap services for geocoding, routing and rank discovery. The
# public servers allow light use only (about 1 request/second); OsmGateway
# enforces that and caches responses. Point these at self-hosted instances
# for production traffic.
tekisi.osm.nominatim-url=${OSM_NOMINATIM_URL:https://nominatim.openstreetmap.org}
tekisi.osm.osrm-url=${OSM_OSRM_URL:https://router.project-osrm.org}
tekisi.osm.overpass-url=${OSM_OVERPASS_URL:https://overpass-api.de/api/interpreter}
tekisi.osm.user-agent=${OSM_USER_AGENT:e-tekisi/1.0}

# TripAnomalyAgent — bounded thresholds for the operator-side insight engine.
tekisi.agent.insight.high-fare-rand=400.0
tekisi.agent.insight.min-pings-for-trip=3

# Decision audit retention. The scheduled cleanup job deletes rows older than
# this many days from agent_schema.decision_audit. Set to 0 to disable.
tekisi.agent.audit.retention-days=${AUDIT_RETENTION_DAYS:90}

# Personal-data retention (POPIA: keep it no longer than needed). The daily
# DataRetentionJob deletes rows older than these many days; 0 disables one.
# Trip GPS of trips with a CRITICAL safety insight is kept regardless.
tekisi.retention.trip-gps-days=${RETENTION_TRIP_GPS_DAYS:90}
tekisi.retention.driver-location-days=${RETENTION_DRIVER_LOCATION_DAYS:7}
tekisi.retention.messages-days=${RETENTION_MESSAGES_DAYS:180}
tekisi.retention.notifications-days=${RETENTION_NOTIFICATIONS_DAYS:90}
tekisi.retention.cron=0 30 3 * * *

# ---------------------------------------------------------------------------
# HikariCP — connection pool. Dev defaults are conservative; prod tunes up.
# ---------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:10000}

# ---------------------------------------------------------------------------
# Actuator — operationally visible endpoints. Auth is layered separately:
# /actuator/health is public, everything else needs OPERATOR role.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
# HTTP Basic credentials for the Prometheus scraper on /actuator/prometheus
# (operator tokens work too). Empty = operator tokens only.
tekisi.metrics.username=${METRICS_USERNAME:}
tekisi.metrics.password=${METRICS_PASSWORD:}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.diskspace.enabled=true
management.health.db.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.profile=${spring.profiles.active}
# Latency buckets, so alert rules can compute p95 (histogram_quantile).
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ---------------------------------------------------------------------------
# Accounts: consent, verification, password reset
# ---------------------------------------------------------------------------
# Version of the terms of use + privacy policy (+ driver agreement) people
# accept at sign-up. Change it whenever the documents change: everyone is then
# asked to accept the new version the next time they open the app.
tekisi.legal.version=${LEGAL_VERSION:2026-10-20-draft}
# Where the frontend lives; used in the links in verification/reset emails.
tekisi.public-url=${PUBLIC_URL:http://localhost:3000}
# Email goes over SMTP when SPRING_MAIL_HOST is set (with SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD). In dev, without it, emails
# are only written to the log.
tekisi.mail.from=${MAIL_FROM:e-Tekisi <no-reply@localhost>}
tekisi.notify.log-fallback=${NOTIFY_LOG_FALLBACK:true}
tekisi.notify.email-required=${EMAIL_REQUIRED:false}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# SMS codes: none | log (dev) | bulksms | clickatell | twilio | generic.
tekisi.sms.provider=${SMS_PROVIDER:log}
tekisi.sms.url=${SMS_URL:}
tekisi.sms.username=${SMS_USERNAME:}
tekisi.sms.password=${SMS_PASSWORD:}
tekisi.sms.from=${SMS_FROM:}
