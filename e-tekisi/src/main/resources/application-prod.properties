# ============================================================================
# PRODUCTION PROFILE
#
# This file layers over application.properties. Every value here either:
#   (a) overrides a dev-only default with a stricter prod value, OR
#   (b) re-binds an env-var-sourced property WITHOUT a fallback default, so
#       the application FAILS FAST at startup if the secret isn't injected.
#
# Do NOT add hardcoded secrets, hostnames, or URLs to this file.
# ============================================================================

# ----- Database: env vars are required (no fallback) -----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production must NEVER mutate schema at runtime. Only Flyway can.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway must validate migrations against the deployed binary in prod.
spring.flyway.validate-on-migrate=true
# Disable baseline-on-migrate in prod — the baseline must be authored, not auto-detected.
spring.flyway.baseline-on-migrate=false

# ----- Security: JWT secret + issuer required, no fallback -----
tekisi.security.jwt.secret=${JWT_SIGNING_SECRET}
tekisi.security.jwt.issuer=${JWT_ISSUER}
tekisi.security.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}

# CORS allow-list MUST be enumerated explicitly. No wildcards.
tekisi.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ----- HikariCP: production-sized pool -----
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
# Postgres-side hard timeouts to prevent runaway queries pinning a connection.
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '5s'; SET idle_in_transaction_session_timeout = '30s';

# ----- Payments: the sandbox provider must never run in prod -----
tekisi.payments.sandbox-enabled=false

# ----- Routing API: required if enabled -----
tekisi.agent.eta.routing.enabled=${ROUTING_API_ENABLED:true}
tekisi.agent.eta.routing.base-url=${ROUTING_API_BASE_URL}
tekisi.agent.eta.routing.api-key=${ROUTING_API_KEY:}

# ----- Audit retention: 90 days unless explicitly tuned -----
tekisi.agent.audit.retention-days=${AUDIT_RETENTION_DAYS:90}

# ----- Actuator hardening: only health is public; the rest require auth -----
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info,metrics,prometheus
