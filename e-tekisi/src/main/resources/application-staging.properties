# ============================================================================
# STAGING PROFILE: layered on top of "prod" (SPRING_PROFILES=prod,staging).
#
# Same code, configuration and security as production, on its own server,
# domain and database, so releases and restore drills can be rehearsed. The
# only differences are below. Never point staging at production data.
# ============================================================================

# Test money only: the sandbox top-up works (no payment provider is called).
tekisi.payments.sandbox-enabled=true

# Push notifications: keys from VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY only (off when unset).
tekisi.push.generate-if-missing=false
