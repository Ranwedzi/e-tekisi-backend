# Test profile: keep tests independent of a running Postgres.
# H2 in PostgreSQL compatibility mode covers JPA + Hibernate behaviour for our tables.

spring.datasource.url=jdbc:h2:mem:tekisi_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS commuter_schema\\;CREATE SCHEMA IF NOT EXISTS driver_schema\\;CREATE SCHEMA IF NOT EXISTS agent_schema
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Disable JPA-level bean validation in tests. Controller-level @Valid still
# runs through Spring MVC; JPA persist-time validation would otherwise reject
# the test fixtures (which intentionally use short passwords / test emails).
spring.jpa.properties.jakarta.persistence.validation.mode=none

# Keep the agent layer fully deterministic in tests.
tekisi.agent.intent.llm-enabled=false

# Flyway is disabled in tests; H2 + create-drop is the test contract.
# Flyway migration scripts are validated separately by FlywayMigrationTest.
spring.flyway.enabled=false

# Test-only override: throttling is disabled to keep listener semantics
# predictable in unit/integration tests.
tekisi.agent.throttle.location-min-interval-seconds=0
tekisi.agent.throttle.location-min-movement-meters=0.0

# External routing disabled in tests — heuristic is the only provider.
tekisi.agent.eta.routing.enabled=false

# Security is always on. Tests authenticate with
# SecurityMockMvcRequestPostProcessors.jwt() — see integration/TestAuth.
tekisi.security.jwt.secret=test-only-secret-min-32-bytes-xxxxxxxx
tekisi.security.jwt.issuer=tekisi-test
tekisi.security.jwt.expiry-minutes=60
tekisi.cors.allowed-origins=http://localhost:3000

# Sandbox payments so top-up tests can run.
tekisi.payments.sandbox-enabled=true

# Disable audit retention scheduler in tests so @Scheduled doesn't fight @DirtiesContext.
tekisi.agent.audit.retention-days=0

# Actuator off in tests — H2 + Flyway off would otherwise complicate health.
management.endpoints.web.exposure.include=

# Field encryption key for tests (base64 of 32 bytes).
tekisi.security.data-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
# Login throttling: loose in tests, which share one IP and many accounts.
tekisi.security.login.ip-requests-per-minute=100000

# Account emails and SMS are captured in memory (NotifyConfig.Log*Sender).
tekisi.notify.log-fallback=true
tekisi.sms.provider=log
tekisi.legal.version=test-terms-v1
tekisi.public-url=http://localhost:3000
