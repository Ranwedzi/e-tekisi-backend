# Tekisi production compose stack (single-VM deployment).
#
# Usage:
#   1) Copy .env.example to .env and fill in real secrets.
#   2) docker compose -f docker-compose.prod.yml up -d --build
#
# Postgres data lives on a named volume so container recreates do not lose
# state. The app waits for the DB health-check before starting; the app's own
# health-check is consumed by upstream load balancers / orchestrators.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-etekisi}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - tekisi_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-etekisi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-etekisi}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-https://tekisi.local}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      TEKISI_SECURITY_MODE: jwt
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  tekisi_pgdata:
