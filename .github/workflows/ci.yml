name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-tekisi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B -ntp verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: e-tekisi/target/surefire-reports/

  secret-scan:
    name: Secret Grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if the retired dev password reappears
        # `etekisi@123` was once committed as the local DB password. It is no
        # longer used anywhere; any occurrence in source is a leak. .github is
        # excluded because this step itself has to name it.
        run: |
          set -e
          MATCHES=$(grep -RIn --exclude-dir=.git --exclude-dir=target --exclude-dir=.github \
                    'etekisi@123' . || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Retired hard-coded credential found:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No leaked credentials."

      - name: Fail if a real JWT secret is committed
        run: |
          set -e
          # Reject any obvious base64 secret in tracked files (excluding test/dev defaults).
          MATCHES=$(grep -RInE 'JWT_SIGNING_SECRET[[:space:]]*=[[:space:]]*[A-Za-z0-9+/]{40,}' \
                    --exclude-dir=.git --exclude-dir=target \
                    --exclude='*.example' . || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ JWT signing secret appears to be committed:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No JWT secret leaks."

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-tekisi
    # Allow this to fail without blocking PRs while we tune suppressions.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run OWASP dependency-check
        run: ./mvnw -B -ntp org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8 || true

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [build-and-test, secret-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: e-tekisi
          file: e-tekisi/Dockerfile
          push: false
          tags: tekisi-backend:${{ github.sha }}
