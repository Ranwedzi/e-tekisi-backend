name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-tekisi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B -ntp verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: e-tekisi/target/surefire-reports/

  secret-scan:
    name: Secret Grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if the retired dev password reappears
        # `etekisi@123` was once committed as the local DB password. It is no
        # longer used anywhere; any occurrence in source is a leak. .github is
        # excluded because this step itself has to name it.
        run: |
          set -e
          MATCHES=$(grep -RIn --exclude-dir=.git --exclude-dir=target --exclude-dir=.github \
                    'etekisi@123' . || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Retired hard-coded credential found:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No leaked credentials."

      - name: Fail if a real JWT secret is committed
        run: |
          set -e
          # Reject any obvious base64 secret in tracked files (excluding test/dev defaults).
          MATCHES=$(grep -RInE 'JWT_SIGNING_SECRET[[:space:]]*=[[:space:]]*[A-Za-z0-9+/]{40,}' \
                    --exclude-dir=.git --exclude-dir=target \
                    --exclude='*.example' . || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ JWT signing secret appears to be committed:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No JWT secret leaks."

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-tekisi
    # Blocking: a dependency with a known CVSS >= 7 fails the build. Vetted
    # false positives go in e-tekisi/dependency-check-suppressions.xml with a
    # reason. Set the NVD_API_KEY secret (free from nvd.nist.gov), or the
    # database download is very slow.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache the vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-db-${{ github.run_id }}
          restore-keys: owasp-db-

      - name: Run OWASP dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          ./mvnw -B -ntp org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=7
          -DsuppressionFile=dependency-check-suppressions.xml
          -DnvdApiKey="$NVD_API_KEY"
          -Dformats=HTML,JSON

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: e-tekisi/target/dependency-check-report.*

  # The whole app in Docker (Postgres, backend, Mailpit, frontend) driven by
  # the frontend's Playwright suite. Needs the repository variable
  # FRONTEND_REPOSITORY (owner/name) and, if that repo is private, a
  # CROSS_REPO_TOKEN secret that can read it.
  e2e:
    name: End-to-end (full stack)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: vars.FRONTEND_REPOSITORY != ''
    timeout-minutes: 30
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FRONTEND_REPOSITORY }}
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: frontend

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the stack and the e2e suite
        run: backend/scripts/ci-e2e.sh frontend

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [build-and-test, secret-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: e-tekisi
          file: e-tekisi/Dockerfile
          push: false
          tags: tekisi-backend:${{ github.sha }}
