# Prometheus for the single-server prod stack (docker-compose.prod.yml).
# Scrapes the backend over the internal Docker network; the scrape password
# comes from METRICS_PASSWORD (written to /tmp/metrics_password at start-up).

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    stack: tekisi-prod

rule_files:
  - /etc/prometheus/rules/tekisi-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: tekisi-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /tmp/metrics_password
    static_configs:
      - targets: ["backend:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
